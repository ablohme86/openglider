# How the actions the combat classes name behave.
#
# Combat classes say *what* to do ("Warrior.Rend"). The key it is pressed with
# comes from your action bars: the bot reads them when it attaches, and moves,
# jumps and targets on the keys your character has for that. This file only
# says what the action bars cannot tell:
#
#   gcd:      true = on the global cooldown (spells and abilities)
#   cooldown: seconds before the bot may use the action again
#   castTime: seconds the cast takes at most (the bot stands still for it)
#   range:    furthest the target may be, in yards; minRange the nearest
#   friendly: true = can be cast on others (a heal, a shield): a party healer's
#             emergency rules cast it on the party members too
#   chat:     a slash command typed for the action instead of pressing a button
#             ("/petattack")
#
# A spell that is not listed still works when it is on an action bar; list it
# to give it a range, a cast time or a cooldown.

globalCooldown: 1.5

actions:
  # --- movement and the player ------------------------------------------------
  Move.Forward: {}
  Move.Backward: {}
  Move.TurnLeft: {}
  Move.TurnRight: {}
  Move.StrafeLeft: {}
  Move.StrafeRight: {}
  Target.Next: {}
  Target.Clear: {}
  Move.Jump:
    cooldown: 0.5
  Move.SwimUp: {}         # held in the water: the client's Jump key
  Move.SwimDown: {}       # held in the water: the client's Sit/Move Down key
  Player.Interact:
    cooldown: 0.5
  Player.ReleaseSpirit:
    cooldown: 3
  Player.RetrieveCorpse:
    cooldown: 2
  Camera.ResetView:
    cooldown: 1.0
  Player.HealthPotion:    # a healing potion or healthstone on an action bar
    cooldown: 120
  Player.ManaPotion:      # a mana potion on an action bar
    cooldown: 120
  Player.Eat:
    cooldown: 20
  Player.Drink:
    cooldown: 20

  # --- pet ----------------------------------------------------------------------
  # Fallback for clients without UI reading. With UI reading the standard
  # pet bar's command buttons are clicked instead. An explicit pet spell, e.g.
  #   Pet.Firebolt: { chat: "/cast Firebolt", cooldown: 1.0 }
  Pet.Attack:
    chat: "/petattack"
    cooldown: 1.0
  Pet.Follow:
    chat: "/petfollow"
    cooldown: 1.0
  Pet.Stay:
    chat: "/petstay"
    cooldown: 1.0
  Pet.Passive:
    chat: "/petpassive"
    cooldown: 1.0
  Pet.Defensive:
    chat: "/petdefensive"
    cooldown: 1.0
  Pet.Aggressive:
    chat: "/petaggressive"
    cooldown: 1.0

